services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tidy
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tidy"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://postgres:postgres@db:5432/tidy?sslmode=disable
      AUTO_MIGRATE: "true"
      JWT_SECRET: local-development-secret-change-me-0123456789
      PAYMENT_PROVIDER: mock
      PUSH_PROVIDER: log
    ports:
      - "8080:8080"

volumes:
  db-data:

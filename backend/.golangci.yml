version: "2"

linters:
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
    - unconvert
  settings:
    errcheck:
      # Close errors on read paths carry no information we could act on.
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.DB).Close
        - (*github.com/coder/websocket.Conn).CloseNow
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/oxunov713/tidy/backend

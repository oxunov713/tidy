name: tidy_cleaner
description: "Tidy cleaner app, for accepting jobs and tracking earnings."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  geolocator: ^14.1.2
  go_router: ^18.1.4
  intl: ^0.20.3
  material_ui: ^1.11.1
  riverpod_annotation: ^4.0.8
  shared_preferences: ^2.5.6
  tidy_core:
    path: ../../packages/tidy_core
  tidy_ui:
    path: ../../packages/tidy_ui
  url_launcher: ^6.3.3

dev_dependencies:
  build_runner: ^2.17.1
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  google_fonts: ^9.0.0
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.10

flutter:
  uses-material-design: true
  generate: true

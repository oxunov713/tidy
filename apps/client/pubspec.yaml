name: tidy_client
description: "Tidy customer app, for booking a cleaner and following the visit."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_stripe: ^15.0.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  intl: ^0.20.3
  material_ui: ^1.11.1
  riverpod_annotation: ^4.0.8
  shared_preferences: ^2.5.6
  tidy_core:
    path: ../../packages/tidy_core
  tidy_ui:
    path: ../../packages/tidy_ui
dev_dependencies:
  build_runner: ^2.17.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  riverpod_generator: ^4.0.10

flutter:
  uses-material-design: true
  generate: true
